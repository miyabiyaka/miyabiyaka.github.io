<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahoo!フリマ 購入パステスト</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 20px; background: #111; color: #eee; }
.btn { display: block; width: 100%; padding: 14px; margin: 6px 0; background: #2563eb; color: white;
       border: none; border-radius: 8px; font-size: 14px; text-align: center; text-decoration: none; }
.btn:active { background: #1d4ed8; }
.section { margin-top: 20px; padding-top: 12px; border-top: 1px solid #333; }
h2 { font-size: 16px; margin: 0 0 8px; }
p { font-size: 13px; color: #999; margin: 0 0 12px; }
</style>
</head>
<body>
<h2>paypayfleamarket:// 購入パス テスト</h2>
<p>スキーム確定済み。購入手続きに直行するパスを探します。<br>各ボタンをタップしてアプリのどの画面が開くか確認。</p>

<div class="section">
<h2>A. 注文系パス</h2>
<a class="btn" href="paypayfleamarket://item/z681476030/order">item/{id}/order</a>
<a class="btn" href="paypayfleamarket://order/z681476030">order/{id}</a>
<a class="btn" href="paypayfleamarket://purchase/z681476030">purchase/{id}</a>
<a class="btn" href="paypayfleamarket://buy/z681476030">buy/{id}</a>
<a class="btn" href="paypayfleamarket://checkout/z681476030">checkout/{id}</a>
</div>

<div class="section">
<h2>B. openUrl 方式（メルカリ型）</h2>
<a class="btn" href="paypayfleamarket://app/openUrl?url=https%3A%2F%2Fpaypayfleamarket-sec.yahoo.co.jp%2Fitem%2Fz681476030%2Forder">app/openUrl → -sec/order</a>
<a class="btn" href="paypayfleamarket://openUrl?url=https%3A%2F%2Fpaypayfleamarket.yahoo.co.jp%2Fitem%2Fz681476030">openUrl → item page</a>
<a class="btn" href="paypayfleamarket://open?url=https%3A%2F%2Fpaypayfleamarket-sec.yahoo.co.jp%2Fitem%2Fz681476030%2Forder">open → -sec/order</a>
</div>

<div class="section">
<h2>C. 商品ページ（比較用）</h2>
<a class="btn" href="paypayfleamarket://item/z681476030">item/{id}（前回確認済み）</a>
</div>
</body>
</html>
