<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Purchase Assist</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: #111318; color: #f7f7f8;
         font-family: -apple-system, "Hiragino Sans", sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { text-align: center; padding: 24px; width: 100%; max-width: 420px; }
  #status { font-size: 16px; min-height: 1.2em; margin: 0 0 12px; }
  #status.error { color: #ff6b6b; }
  #status.ok { color: #b7bac2; }
  a.fallback { display: inline-block; color: #8ab4f8; font-size: 14px; margin-top: 16px; text-decoration: none; }
  .note { color: #666; font-size: 12px; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <p id="status" class="ok">メルカリへ移動しています…</p>
  <div id="fallback-zone" hidden>
    <a id="manual-link" class="fallback">手動で開く</a>
  </div>
  <p class="note">このページは注文情報を読み取り・保存・転送しません。</p>
</main>
<script>
(function () {
  var statusEl = document.getElementById("status");
  var fallbackZone = document.getElementById("fallback-zone");
  var manualLink = document.getElementById("manual-link");

  function showError(msg) {
    statusEl.textContent = msg;
    statusEl.className = "error";
  }

  // 2026-09-03: ?id=（query）はアプリ中継経路（UL不発時の保険）。m…=個人出品、2[A-Za-z0-9]{20+}=Shops品。#id=（hash）は旧Safari拡張経路
  var q = new URLSearchParams(location.search);
  var qId = q.get("id") || "";
  var qV = q.get("v") || "";
  var isMPrefix = /^m\d{6,}$/.test(qId);
  var isShops = /^2[A-Za-z0-9]{20,}$/.test(qId);
  if (qId && (isMPrefix || isShops)) {
    var appTarget;
    if (isShops && qV && /^2[A-Za-z0-9]{20,}$/.test(qV)) {
      appTarget = "mercari://app/openUrl?url=" + encodeURIComponent("https://mercari-shops.com/purchase/" + qId + "/" + qV);
      statusEl.textContent = "メルカリアプリの購入手続きへ移動しています…";
      manualLink.textContent = "🛒 アプリで購入手続きを開く";
    } else if (isShops) {
      appTarget = "mercari://app/openUrl?url=" + encodeURIComponent("https://mercari-shops.com/products/" + qId);
      statusEl.textContent = "メルカリアプリの商品ページへ移動しています…";
      manualLink.textContent = "🛒 アプリで商品ページを開く";
    } else {
      appTarget = "mercari://app/openUrl?url=" + encodeURIComponent("https://jp.mercari.com/purchase/" + qId);
      statusEl.textContent = "メルカリアプリの購入確認へ移動しています…";
      manualLink.textContent = "🛒 アプリで購入確認を開く";
    }
    manualLink.href = appTarget;
    fallbackZone.hidden = false;
    location.href = appTarget;
    return;
  }
  var params = new URLSearchParams(location.hash.slice(1));
  var itemId = params.get("id");
  var mp = params.get("mp");

  if (!itemId || !/^m\d{6,}$/.test(itemId)) {
    showError("リンクが不完全です");
    return;
  }

  var target = "https://jp.mercari.com/purchase/" + itemId + "#pa=1";
  if (mp && /^\d+$/.test(mp)) {
    target += "&mp=" + mp;
  }
  if (params.get("dry") === "1") {
    target += "&dry=1";
  }

  manualLink.href = target;
  fallbackZone.hidden = false;

  location.replace(target);
})();
</script>
</body>
</html>
