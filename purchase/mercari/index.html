<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Purchase Assist</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: #111318; color: #f7f7f8;
         font-family: -apple-system, "Hiragino Sans", sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { text-align: center; padding: 24px; width: 100%; max-width: 420px; }
  #status { font-size: 16px; min-height: 1.2em; margin: 0 0 12px; }
  #status.error { color: #ff6b6b; }
  #status.ok { color: #b7bac2; }
  a.fallback { display: inline-block; color: #8ab4f8; font-size: 14px; margin-top: 16px; text-decoration: none; }
  .note { color: #666; font-size: 12px; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <p id="status" class="ok">読み込み中…</p>
  <div id="fallback-zone" hidden>
    <a id="manual-link" class="fallback">手動で開く</a>
  </div>
  <p class="note">このページは注文情報を読み取り・保存・転送しません。</p>
</main>
<script>
(function () {
  var statusEl = document.getElementById("status");
  var fallbackZone = document.getElementById("fallback-zone");
  var manualLink = document.getElementById("manual-link");

  function showError(msg) {
    statusEl.textContent = msg;
    statusEl.className = "error";
  }

  function showFallback(itemId) {
    var url = "https://jp.mercari.com/item/" + itemId;
    manualLink.href = url;
    fallbackZone.hidden = false;
  }

  var fragment = location.hash.slice(1);
  if (!fragment) {
    showError("リンクが不完全です");
    return;
  }

  var parts = fragment.split(".");
  if (parts.length !== 3 || parts[0] !== "pa1") {
    showError("不正な形式です");
    return;
  }

  var raw = parts[1];
  raw = raw.replace(/-/g, "+").replace(/_/g, "/");
  while (raw.length % 4) raw += "=";

  var payload;
  try {
    payload = JSON.parse(atob(raw));
  } catch (e) {
    showError("読み取れません");
    return;
  }

  var itemId = payload.itemId;
  if (typeof itemId !== "string" || !/^m\d{6,}$/.test(itemId)) {
    showError("不正な商品IDです");
    return;
  }

  var now = Math.floor(Date.now() / 1000);
  if (typeof payload.exp === "number" && payload.exp > 0 && now > payload.exp + 30) {
    showError("リンクの有効期限が切れています");
    showFallback(itemId);
    return;
  }

  statusEl.textContent = "メルカリへ移動しています…";
  showFallback(itemId);
  location.replace("https://jp.mercari.com/item/" + itemId + "?pa=1#" + fragment);
})();
</script>
</body>
</html>
